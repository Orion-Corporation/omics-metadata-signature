schema_version: 1.2.0

document:
  type: object
  properties:
    results:
      type: array
      items: result
  required:
    - results

record:
  name: result

fields:
  - name: results_path
    type: string

  - name: results_url
    type: string

  - name: bioinformatics_pipeline
    type: string

  - name: pipeline_version
    type: string
