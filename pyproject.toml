[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omics-metadata-signature"
version = "1.1.1"
description = "Authoritative Omics metadata schemas"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Lorenzo Perino" }]
dependencies = ["PyYAML>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omics_metadata_signature = [
  "schemas/**/*.yaml",
  "latest/*.yaml",
  "conventions/*.yaml",
]
